# Spike S4 review relay, part 2: privileged, runs the default branch's copy and
# trusts only the head SHA from the event.
name: riskinator-relay

on:
  workflow_run:
    workflows: [riskinator-review]
    types: [completed]

permissions: {}

jobs:
  gate:
    permissions:
      id-token: write
      contents: read
    uses: toro-fast-CHI/gate-spike/.github/workflows/gate.yml@7c16091d2dadae64c921c7a4f61a2e10a5746f2f
