# Spike S4 attack T3b: the PR rewrites the caller. pull_request_target must run
# the default branch's copy, so this job must never appear.
name: riskinator

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  pwned:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "PWNED-CALLER this must never run"
